name: Corpus integrity and AI synchronization
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_source_action_plan.py
      - run: python scripts/build_reference.py
      - run: python scripts/build_governance.py
      - run: python scripts/build_source_worklist.py
      - run: python scripts/build_review.py
      - run: python scripts/validate.py
      - run: python ai-skill/scripts/build_bundle.py
      - run: python -m unittest discover -s tests -v
      - run: python ai-skill/scripts/validate_bundle.py
      - name: Validate method-parity interfaces
        run: |
          python scripts/test_preexpert_parity.py
          python scripts/build_corpus_browser.py
          test -s workbench/corpus-browser.html
          python scripts/research_api.py records --text S1 --limit 2 > /tmp/sidetic-api.json
          python scripts/export_research_layer.py json /tmp/sidetic.json
          test -s /tmp/sidetic.json.manifest.json
