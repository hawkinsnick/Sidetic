name: Corpus integrity and AI synchronization
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_reference.py
      - run: python scripts/build_governance.py
      - run: python scripts/validate.py
      - run: python ai-skill/scripts/build_bundle.py
      - run: python -m unittest discover -s tests -v
      - run: python ai-skill/scripts/validate_bundle.py
  sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ai-skill/scripts/build_bundle.py
      - run: python ai-skill/scripts/validate_bundle.py
      - name: Save refreshed AI interface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-skill/generated ai-skill/Research-Starter.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize AI research evidence fingerprints'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
